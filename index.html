<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>健身打卡</title>
  
  <!-- PWA 全螢幕與圖示配置 -->
  <meta name="theme-color" content="#DA4A1C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E5%81%A5%E8%BA%AB%E6%89%93%E5%8D%A1%22%2C%22short_name%22%3A%22%E6%89%93%E5%8D%A1%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FBF7F0%22%2C%22theme_color%22%3A%22%23DA4A1C%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Crect%20width%3D'100'%20height%3D'100'%20rx%3D'20'%20fill%3D'%23DA4A1C'%2F%3E%3Ctext%20x%3D'50'%20y%3D'68'%20font-size%3D'60'%20text-anchor%3D'middle'%20fill%3D'white'%3E%F0%9F%8F%8B%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #FBF7F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      color: #333;
    }
    .calendar-container {
      width: 100%;
      max-width: 400px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .cal-header {
      background-color: #DA4A1C;
      color: #FFFFFF;
      padding: 18px 20px 24px;
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .binder-rings {
      position: absolute;
      top: -10px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      padding: 0 20px;
    }
    .ring {
      width: 14px;
      height: 22px;
      background: #E5E0D8;
      border-radius: 7px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
    }
    .nav-arrow {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .month-nav { display: flex; align-items: center; gap: 8px; }
    .month-display { line-height: 1; }
    .year-txt { font-size: 13px; opacity: 0.85; font-weight: 500; margin-bottom: 2px; }
    .month-num { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
    .stats-display { text-align: right; }
    .stats-label { font-size: 13px; opacity: 0.9; }
    .stats-days { font-size: 32px; font-weight: 800; margin-left: 2px; }
    .cal-body { padding: 20px 16px; }
    .weekdays-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      color: #7A7A7A;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 12px;
      transition: transform 0.2s ease-out;
    }
    .day-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 44px;
      cursor: pointer;
    }
    .day-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      color: #333333;
      position: relative;
    }
    .checked-in .day-circle {
      background-color: #E7B482;
      color: #FFFFFF;
      font-weight: 700;
    }
    .milestone::after {
      content: '✓';
      position: absolute;
      top: -3px;
      right: -3px;
      background-color: #E54B24;
      color: #FFFFFF;
      font-size: 9px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #FFFFFF;
      font-weight: bold;
    }
    .is-today .day-circle { outline: 2px dashed #DA4A1C; outline-offset: 2px; }
    .other-month { opacity: 0; pointer-events: none; }
    .action-container { width: 100%; max-width: 400px; margin-top: 24px; }
    .btn-checkin {
      width: 100%;
      padding: 15px 0;
      border-radius: 14px;
      border: none;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: all 0.2s ease;
    }
    .btn-pending { background-color: #DA4A1C; color: #FFFFFF; }
    .btn-done { background-color: #9AA4B2; color: #FFFFFF; }
  </style>
</head>
<body>

  <div class="calendar-container" id="calendarCard">
    <div class="cal-header">
      <div class="binder-rings">
        <div class="ring"></div><div class="ring"></div>
        <div class="ring"></div><div class="ring"></div>
      </div>
      <div class="month-nav">
        <button class="nav-arrow" id="prevBtn">❮</button>
        <div class="month-display">
          <div class="year-txt" id="yearLabel">2026</div>
          <div class="month-num" id="monthLabel">10</div>
        </div>
        <button class="nav-arrow" id="nextBtn">❯</button>
      </div>
      <div class="stats-display">
        <span class="stats-label">本月已健身累積</span>
        <span class="stats-days" id="countLabel">0</span><span style="font-size:14px; margin-left:2px;">天</span>
      </div>
    </div>

    <div class="cal-body">
      <div class="weekdays-row">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </div>
  </div>

  <div class="action-container">
    <button class="btn-checkin btn-pending" id="todayBtn">今日健身打卡</button>
  </div>

  <script>
    const STORAGE_KEY = 'workout_records_data';
    let checkins = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();

    const yearLabel = document.getElementById('yearLabel');
    const monthLabel = document.getElementById('monthLabel');
    const countLabel = document.getElementById('countLabel');
    const daysGrid = document.getElementById('daysGrid');
    const todayBtn = document.getElementById('todayBtn');
    const calendarCard = document.getElementById('calendarCard');

    function formatDate(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function renderCalendar() {
      yearLabel.textContent = currentYear;
      monthLabel.textContent = currentMonth + 1;
      daysGrid.innerHTML = '';

      const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
      const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

      const prefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
      const currentMonthChecks = checkins.filter(d => d.startsWith(prefix)).sort();
      countLabel.textContent = currentMonthChecks.length;

      const todayStr = formatDate(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
      const isTodayChecked = checkins.includes(todayStr);

      if (isTodayChecked) {
        todayBtn.textContent = '今日已打卡';
        todayBtn.className = 'btn-checkin btn-done';
      } else {
        todayBtn.textContent = '今日健身打卡';
        todayBtn.className = 'btn-checkin btn-pending';
      }

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell other-month';
        daysGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = formatDate(currentYear, currentMonth, day);
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const circle = document.createElement('div');
        circle.className = 'day-circle';
        circle.textContent = day;

        if (dateStr === todayStr) cell.classList.add('is-today');

        if (checkins.includes(dateStr)) {
          cell.classList.add('checked-in');
          const dayIndex = currentMonthChecks.indexOf(dateStr) + 1;
          if (dayIndex === 7 || dayIndex === 14 || dayIndex === 21) {
            cell.classList.add('milestone');
          }
        }

        cell.onclick = () => toggleDate(dateStr);
        cell.appendChild(circle);
        daysGrid.appendChild(cell);
      }
    }

    function toggleDate(dateStr) {
      if (checkins.includes(dateStr)) {
        checkins = checkins.filter(d => d !== dateStr);
      } else {
        checkins.push(dateStr);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(checkins));
      renderCalendar();
    }

    todayBtn.onclick = () => {
      const todayStr = formatDate(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
      toggleDate(todayStr);
    };

    document.getElementById('prevBtn').onclick = () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    };

    document.getElementById('nextBtn').onclick = () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    };

    let startX = 0;
    calendarCard.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
    calendarCard.addEventListener('touchend', e => {
      const diffX = e.changedTouches[0].clientX - startX;
      if (diffX > 40) document.getElementById('prevBtn').click();
      else if (diffX < -40) document.getElementById('nextBtn').click();
    }, {passive: true});

    renderCalendar();
  </script>
</body>
</html>
